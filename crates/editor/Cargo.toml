[package]
name = "materialcraft-editor"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "MaterialCraft's visual editor: node graphs, the 3D view and Paint mode"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
materialcraft = { path = "../..", features = ["gui"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
materialcraft-substance = { path = "../substance" }
materialcraft-brush = { path = "../brush" }
# The starter library, built on first run when no installed copy is current (gui_assets::starter).
materialcraft-starter = { path = "../starter" }
log = "0.4"
# The Craft suite's shared UI and settings crates, pinned (reuse level 1: depend, nothing goes upstream; ADR 0007).
craft-settings = { git = "https://github.com/storytold/craft-libs", rev = "04e83f095ab080c5672243514f9a44ca6364b0e2" }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "04e83f095ab080c5672243514f9a44ca6364b0e2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
# The bake queue's corpus gate compares its maps with mcparity's bake of the same project (tests only).
materialcraft-parity = { path = "../parity" }

[[bin]]
name = "materialcraft-gui"
path = "src/main.rs"

[lints]
workspace = true
