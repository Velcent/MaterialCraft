name: Nightly

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 0.4.0 (blank rebuilds latest)'
        required: false
        type: string
  schedule:
    - cron: '23 7 * * *' # 07:23 UTC, daily on the default branch.

concurrency:
  group: ${{ inputs.version != '' && format('release-{0}', inputs.version) || 'nightly' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Prepare build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    outputs:
      changed: ${{ steps.meta.outputs.changed }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare build
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: bash .github/scripts/prepare-nightly.sh

  build:
    name: Build and test ${{ matrix.label }}
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep glibc 2.35 compatibility for Ubuntu 22.04 and newer desktops.
          - os: windows-latest
            targets: x86_64-pc-windows-msvc
            test-target: x86_64-pc-windows-msvc
            out: target/x86_64-pc-windows-msvc/release
            label: x64-windows
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      LABEL: ${{ matrix.label }}
      TARGETS: ${{ matrix.targets }}
      TEST_TARGET: ${{ matrix.test-target }}
      OUT: ${{ matrix.out }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Toolchain targets
        id: tc
        run: echo "targets=${TARGETS// /,}" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
          targets: ${{ steps.tc.outputs.targets }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.label }}

      - name: Build CLI and editor
        run: |
          args=()
          for target in $TARGETS; do args+=(--target "$target"); done
          cargo build --locked --release --features gui --bins "${args[@]}"

      - name: Collect license notices
        run: |
          python_cmd=python3
          if [ "$RUNNER_OS" = Windows ]; then python_cmd=python; fi
          "$python_cmd" .github/scripts/collect-notices.py

      - name: Package and verify Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/package-windows.ps1

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish prerelease
    needs: [prepare, build]
    # Publish rolling builds from the default branch, or the requested release tag.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
      (inputs.version != '' && github.ref == format('refs/tags/{0}', inputs.version))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: nightly-*
          path: dist
          merge-multiple: true
      - name: Publish prerelease
        run: bash .github/scripts/publish-nightly.sh
